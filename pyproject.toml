[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-deep-cleaner"
version = "3.0.0"
description = "Professional Mac cleanup tool — Modern Local Storage Analysis & Reviewed Cleanup"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "NK2552003"}]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.optional-dependencies]
terminal = [
    "rich>=13.0.0",
    "questionary>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.scripts]
mac-deep-cleaner = "mac_deep_cleaner.cli:main"
mac-cleaner = "mac_deep_cleaner.cli:main"
mdc = "mac_deep_cleaner.cli:main"

[project.urls]
Homepage = "https://github.com/NK2552003/Mac-Cleaner"
"Bug Tracker" = "https://github.com/NK2552003/Mac-Cleaner/issues"

[tool.setuptools.packages.find]
include = ["mac_deep_cleaner*"]

[tool.setuptools.package-data]
mac_deep_cleaner = ["web/*.html", "web/*.css", "web/*.js", "web/*.png", "web/*.svg", "web/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
